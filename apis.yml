aid: modern-health
name: Modern Health
description: >-
  Modern Health is a global mental health benefits platform that employers offer
  to their workforce, positioning itself as "the global standard in mental health"
  with evidence-based, equitable care delivered worldwide. Its Adaptive Care Model
  spans self-guided digital tools, 1:1 coaching, therapy and counseling, group
  support Circles, and crisis care, matched to members through a Stepped Care
  methodology. The platform serves employers, benefits consultants, health plans,
  and providers, delivering care in 80+ languages across a proprietary provider
  network spanning 200+ countries and territories. Modern Health does not publish
  a public developer API; its surfaces are member and admin web/mobile applications,
  a status page, and a security/trust program. This profile was surfaced as a
  portfolio company of Battery Ventures and enriched with the company's real
  operational, security, and legal surface.
